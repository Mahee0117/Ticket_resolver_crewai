<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="SupportCrew AI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="20" fill="url(#glow)"/>
  <g fill="#ffffff" opacity="0.10">
    <circle cx="120" cy="60" r="70">
      <animate attributeName="cy" values="60;80;60" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="200" r="90">
      <animate attributeName="cy" values="200;180;200" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="50" r="40">
      <animate attributeName="cx" values="980;1010;980" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="215" r="35">
      <animate attributeName="cx" values="230;200;230" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="1">SupportCrew AI</text>
  <text x="600" y="164" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#ede9fe">A Multi-Agent Customer Support &amp; Ticket Resolution System</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="270" y="196" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/>
    <text x="325" y="216">Triage</text>
    <rect x="395" y="196" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/>
    <text x="450" y="216">Routing</text>
    <rect x="520" y="196" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/>
    <text x="575" y="216">Tools</text>
    <rect x="645" y="196" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/>
    <text x="700" y="216">RAG</text>
    <rect x="770" y="196" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.18"/>
    <text x="850" y="216">QA Feedback Loop</text>
  </g>
</svg>
