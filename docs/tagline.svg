<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="900" height="50" role="img" aria-label="Triage, route, tools and RAG, QA" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #8b5cf6; text-anchor: middle; opacity: 0; }
    .t1 { animation: show 9s infinite; }
    .t2 { animation: show 9s infinite 3s; }
    .t3 { animation: show 9s infinite 6s; }
    @keyframes show {
      0%   { opacity: 0; transform: translateY(8px); }
      6%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      36%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
  </style>
  <text class="t1" x="450" y="32">Triage → Route → Tools + RAG → QA</text>
  <text class="t2" x="450" y="32">Specialized agents, one support workflow</text>
  <text class="t3" x="450" y="32">Local LLM | ChromaDB | Streamlit</text>
</svg>
